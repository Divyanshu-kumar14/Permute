# SPDX-License-Identifier: Apache-2.0
# The sensor fan-out: three clients, a collector, pulses, a sampling timer and
# a client cancellation.

[project]
name = "telemetry"
version = "0.1.0"

[run]
seeds = "0-2"
jobs = 1
wall_ms = 5000

[kernel]
max_events = 100000
max_virtual_ms = 30000
scheduler = "priority-fifo"
seed_policy = "random"

[faults]
inject = []

[[invariant]]
id = "dl"
kind = "deadlock"
severity = "error"
